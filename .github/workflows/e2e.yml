name: 'E2E Tests'

on:
  push:
    branches:
      - 'main'
      - 'feat/e2e/**'
  merge_group:

concurrency:
  group: |-
    ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: |-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: 'bash'

jobs:
  merge_queue_skipper:
    name: 'Merge Queue Skipper'
    if: github.repository == 'Jyf0214/AutocodeLLM'
    runs-on: 'ubuntu-latest'
    continue-on-error: true
    permissions: read-all
    outputs:
      skip: '${{ steps.check.outputs.skip }}'
    steps:
      - id: 'check'
        run: |
          skip=false
          [[ "${{ github.event_name }}" == "merge_group" ]] && skip=true
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

  # ── E2E: Linux (sandbox:none + sandbox:docker) ────────────────
  e2e-linux:
    name: 'E2E Test (Linux) - ${{ matrix.sandbox }}'
    if: ${{ !cancelled() && (needs.merge_queue_skipper.outputs.skip != 'true') }}
    needs: 'merge_queue_skipper'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        sandbox:
          - 'sandbox:none'
          - 'sandbox:docker'
        node-version:
          - '22.x'
    steps:
      - uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - uses: 'actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a' # v4.2.0
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: 'Configure npm'
        run: |
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - run: 'npm ci --prefer-offline --no-audit --progress=false'

      - name: 'Build and bundle'
        run: |
          npm run build
          npm run bundle

      - name: 'Set up Docker'
        if: matrix.sandbox == 'sandbox:docker'
        uses: 'docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349' # v3.7.1

      - name: 'Run E2E tests'
        env:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'
          KEEP_OUTPUT: 'true'
          VERBOSE: 'true'
        run: |
          if [[ "${{ matrix.sandbox }}" == "sandbox:docker" ]]; then
            npm run test:integration:sandbox:docker
          else
            npm run test:integration:sandbox:none
          fi

  # ── E2E: macOS ────────────────────────────────────────────────
  e2e-macos:
    name: 'E2E Test (macOS)'
    if: ${{ !cancelled() && (needs.merge_queue_skipper.outputs.skip != 'true') }}
    needs: 'merge_queue_skipper'
    runs-on: 'macos-latest'
    continue-on-error: true
    steps:
      - uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - uses: 'actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a' # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: 'Configure npm'
        run: |
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - run: 'npm ci --prefer-offline --no-audit --progress=false'

      - name: 'Build and bundle'
        run: |
          npm run build
          npm run bundle

      - name: 'Run E2E tests'
        env:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'
        run: 'npm run test:e2e'

  # ── E2E: Windows ──────────────────────────────────────────────
  e2e-windows:
    name: 'E2E Test (Windows)'
    if: ${{ !cancelled() && (needs.merge_queue_skipper.outputs.skip != 'true') }}
    needs: 'merge_queue_skipper'
    runs-on: 'windows-latest'
    continue-on-error: true
    steps:
      - uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - uses: 'actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a' # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: 'Configure npm'
        shell: 'pwsh'
        run: |
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - run: 'npm ci --prefer-offline --no-audit --progress=false'

      - name: 'Build and bundle'
        run: |
          npm run build
          npm run bundle

      - name: 'Run E2E tests'
        shell: 'pwsh'
        env:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'
        run: 'npm run test:e2e'

  # ── Aggregator ────────────────────────────────────────────────
  e2e:
    name: 'E2E'
    if: ${{ always() && github.repository == 'Jyf0214/AutocodeLLM' }}
    needs:
      - 'merge_queue_skipper'
      - 'e2e-linux'
      - 'e2e-macos'
      - 'e2e-windows'
    runs-on: 'ubuntu-latest'
    permissions: read-all
    steps:
      - name: 'Check results'
        env:
          LINUX_RESULT: '${{ needs.e2e-linux.result }}'
          MACOS_RESULT: '${{ needs.e2e-macos.result }}'
          WINDOWS_RESULT: '${{ needs.e2e-windows.result }}'
        run: |
          FAILED=false

          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "✅ $name: $result"
            else
              echo "❌ $name: $result"
              FAILED=true
            fi
          }

          check_result "Linux" "$LINUX_RESULT"
          check_result "macOS" "$MACOS_RESULT"
          check_result "Windows" "$WINDOWS_RESULT"

          if [ "$FAILED" = "true" ]; then
            echo "❌ E2E failed — see individual job logs"
            exit 1
          fi
          echo "✅ All E2E tests passed"
