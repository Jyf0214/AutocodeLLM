name: CI & Docker

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_type:
        description: 'Tag type to build'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - preview
          - base

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  # 加密密钥（CI 构建使用默认值，生产环境应通过 secrets 覆盖）
  KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET || 'ci-default-key-vaults-secret-change-me' }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-default-auth-secret-change-me' }}
  JWKS_KEY: ${{ secrets.JWKS_KEY || '{"keys":[{"d":"ci","dp":"ci","dq":"ci","e":"AQAB","kty":"RSA","n":"ci","p":"ci","q":"ci","qi":"ci","use":"sig","kid":"ci","alg":"RS256"}]}' }}

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Generate version
        run: node scripts/version.mjs

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Verify Prisma Client
        run: test -f node_modules/.prisma/client/index.d.ts && echo "Prisma Client generated successfully" || echo "Prisma Client NOT found"

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  sync-to-hf:
    name: Sync to Hugging Face
    runs-on: ubuntu-latest
    needs: lint
    if: >
      always() &&
      needs.lint.result == 'success' &&
      github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Sync to Hugging Face
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE }}
        run: bash scripts/sync-to-hf.sh

  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    needs: [lint, sync-to-hf]
    if: >
      needs.sync-to-hf.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
      github.event.inputs.tag_type == 'base') ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.lowercase.outputs.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Check if Dockerfile.base changed
        id: check-base
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "$AFTER" | grep -c 'Dockerfile.base' || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep -c 'Dockerfile.base' || true)
            fi
            if [ "$CHANGED" -gt 0 ]; then
              echo "changed=true" >> "${GITHUB_OUTPUT}"
            else
              echo "changed=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        if: steps.check-base.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.IMAGE_NAME }}:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1


  build-latest:
    name: Build Latest Image
    runs-on: ubuntu-latest
    needs: [lint, sync-to-hf, build-base]
    if: >
      needs.sync-to-hf.result == 'success' &&
      needs.lint.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-release:
    name: Build Release Image
    runs-on: ubuntu-latest
    needs: [lint, sync-to-hf, build-base]
    if: >
      needs.sync-to-hf.result == 'success' &&
      needs.lint.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
