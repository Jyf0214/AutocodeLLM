# -------------------------------------------------------------------
# Stale Issues & PRs Management
# -------------------------------------------------------------------
# Marks inactive issues / PRs as stale, then auto-closes if still
# inactive after the grace period.
#
# Design principles (informed by Gemini CLI patterns):
#   - Schedule + manual trigger
#   - Separate inactivity thresholds for issues (90 d) vs PRs (30 d)
#   - 7-day grace window before closing
#   - Exemptions for pinned / security / Dependabot PRs
#   - Concurrency guard to avoid overlapping runs
#   - Repository ownership guard
#   - SHA-pinned third-party actions
# -------------------------------------------------------------------

name: Manage stale issues and PRs

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# -------------------------------------------------------------------
# Concurrency -- prevent overlap between runs of this workflow
# -------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    # Repository ownership guard -- only run in the canonical repo
    if: github.repository == 'Jyf0214/AutocodeLLM'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark and close stale issues and PRs
        # SHA-pinned: actions/stale@v10.3.0
        # Full SHA verified from https://github.com/actions/stale/releases/tag/v10.3.0
        uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899
        with:
          # ---- Inactivity thresholds ----
          days-before-issue-stale: 90
          days-before-pr-stale: 30
          days-before-close: 7

          # ---- Labels ----
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: dependencies

          # ---- Messaging ----
          stale-issue-message: |
            This issue has been inactive for 90 days. Please verify if this
            is still relevant. If no activity is detected in the next 7 days,
            this issue will be automatically closed.

          stale-pr-message: |
            This pull request has been inactive for 30 days. Please verify if
            this is still relevant. If no activity is detected in the next 7
            days, this PR will be automatically closed.

          close-issue-message: |
            This issue has been automatically closed due to continued
            inactivity. Feel free to reopen if it remains relevant.

          close-pr-message: |
            This pull request has been automatically closed due to continued
            inactivity. Feel free to reopen if it remains relevant.

          # ---- Limits ----
          operations-per-run: 100
