name: Copyright Header Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # 受保护的文件：任何人不得删除
  PROTECTED_FILES: "LICENSE NOTICE"
  # 需要版权头的源文件扩展名
  SRC_EXT: '\.(ts|tsx|js|jsx|mjs|cjs|py|java|kt|go|rs)$'

jobs:
  audit:
    name: Copyright Header Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 1: 受保护文件完整性检查 ──────────────────────────
      - name: Check protected files exist
        id: protected
        run: |
          HAS_ERROR=false
          rm -f /tmp/audit_protected.txt

          for f in $PROTECTED_FILES; do
            if [ ! -f "$f" ]; then
              HAS_ERROR=true
              echo "❌  $f 文件不存在或被删除！" >> /tmp/audit_protected.txt
            fi
          done

          if [ "$HAS_ERROR" = false ]; then
            echo "✅ LICENSE 和 NOTICE 文件完好" >> /tmp/audit_protected.txt
          fi

          echo "has_error=$HAS_ERROR" >> "$GITHUB_OUTPUT"

      # ── Step 2: 检测 diff 变更（仅用于上下文报告） ────────────
      - name: Detect diff changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
            HEAD="HEAD"
          fi

          mkdir -p /tmp/audit

          git diff --diff-filter=A --name-only "$BASE" "$HEAD" 2>/dev/null | grep -E "$SRC_EXT" > /tmp/audit/diff_added.txt || true
          git diff --diff-filter=M --name-only "$BASE" "$HEAD" 2>/dev/null | grep -E "$SRC_EXT" > /tmp/audit/diff_modified.txt || true
          git diff --diff-filter=R --name-only "$BASE" "$HEAD" 2>/dev/null | grep -E "$SRC_EXT" > /tmp/audit/diff_renamed.txt || true
          git diff --diff-filter=D --name-only "$BASE" "$HEAD" 2>/dev/null | grep -E "$SRC_EXT" > /tmp/audit/diff_deleted.txt || true

          echo "added=$(wc -l < /tmp/audit/diff_added.txt)" >> "$GITHUB_OUTPUT"
          echo "modified=$(wc -l < /tmp/audit/diff_modified.txt)" >> "$GITHUB_OUTPUT"
          echo "renamed=$(wc -l < /tmp/audit/diff_renamed.txt)" >> "$GITHUB_OUTPUT"
          echo "deleted=$(wc -l < /tmp/audit/diff_deleted.txt)" >> "$GITHUB_OUTPUT"

      # ── Step 3: 全量扫描 —— 检查仓库中所有源文件的版权头 ────
      #     这是核心防线：无论文件是什么时候改的，只要缺少版权头就报错
      - name: Full scan — all source files
        id: fullscan
        run: |
          HAS_ERROR=false
          rm -f /tmp/audit/fullscan.txt

          echo "🔍 全量扫描源文件版权头..."

          # 查找所有源文件，排除常见非源码目录
          find . -type f \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.next/*' \
            -not -path './dist/*' \
            -not -path './.bundle/*' \
            -not -path './coverage/*' \
            -not -path './.qwen/*' \
            -not -path './.gemini/*' \
            -not -path './vendor/*' \
            -not -path './third_party/*' \
            -regextype posix-extended -regex ".*$SRC_EXT" \
            > /tmp/audit/all_src.txt

          TOTAL=$(wc -l < /tmp/audit/all_src.txt)
          echo "  共发现 $TOTAL 个源文件"

          SCANNED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            SCANNED=$((SCANNED + 1))
            # 每扫描 500 个文件输出一次进度
            if [ $((SCANNED % 500)) -eq 0 ]; then
              echo "  进度: $SCANNED / $TOTAL"
            fi

            # 检查版权头和 SPDX
            has_copyright=false; has_spdx=false
            head -10 "$file" 2>/dev/null | grep -q "Copyright "  && has_copyright=true
            head -10 "$file" 2>/dev/null | grep -q "SPDX-License-Identifier" && has_spdx=true

            if [ "$has_copyright" = false ] || [ "$has_spdx" = false ]; then
              HAS_ERROR=true
              echo -n "  ❌  ${file#./}" >> /tmp/audit/fullscan.txt
              [ "$has_copyright" = false ] && echo -n " [缺 Copyright]" >> /tmp/audit/fullscan.txt
              [ "$has_spdx" = false ] && echo -n " [缺 SPDX]" >> /tmp/audit/fullscan.txt
              echo "" >> /tmp/audit/fullscan.txt
            fi
          done < /tmp/audit/all_src.txt

          echo "  扫描完成: $SCANNED / $TOTAL"
          echo "has_error=$HAS_ERROR" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      # ── Step 4: 生成汇总报告 ────────────────────────────────────
      - name: Generate summary
        id: summary
        run: |
          PROTECTED_ERROR=false
          [ -s /tmp/audit_protected.txt ] && head -1 /tmp/audit_protected.txt | grep -q "❌" && PROTECTED_ERROR=true

          FULLSCAN_ERROR=false
          FULLSCAN_COUNT=0
          [ -s /tmp/audit/fullscan.txt ] && { FULLSCAN_ERROR=true; FULLSCAN_COUNT=$(wc -l < /tmp/audit/fullscan.txt); }

          IS_ERROR=false
          [ "$PROTECTED_ERROR" = true ] && IS_ERROR=true
          [ "$FULLSCAN_ERROR" = true ] && IS_ERROR=true

          DIFF_ADDED=$(cat /tmp/audit/diff_added.txt 2>/dev/null | wc -l)
          DIFF_MODIFIED=$(cat /tmp/audit/diff_modified.txt 2>/dev/null | wc -l)
          DIFF_RENAMED=$(cat /tmp/audit/diff_renamed.txt 2>/dev/null | wc -l)
          DIFF_DELETED=$(cat /tmp/audit/diff_deleted.txt 2>/dev/null | wc -l)

          {
            echo "## 📋 版权头审计报告"
            echo ""

            # 1. 受保护文件
            echo "### 🔒 受保护文件"
            cat /tmp/audit_protected.txt
            echo ""

            # 2. 全量扫描结果
            if [ "$FULLSCAN_ERROR" = true ]; then
              echo "### 🚨 全量扫描：${FULLSCAN_COUNT} 个文件缺少版权头"
              echo ""
              echo "> 以下文件缺少 Copyright 声明或 SPDX-License-Identifier。"
              echo "> 原有文件**必须保留**原始版权头（Google LLC / Qwen Team）。"
              echo "> 新增文件应添加：\`Copyright 2026 Jyf0214\`"
              echo ""
              echo '```'
              cat /tmp/audit/fullscan.txt
              echo '```'
            else
              echo "### ✅ 全量扫描：${{ steps.fullscan.outputs.total }} 个源文件版权头全部正常"
            fi
            echo ""

            # 3. 本次 diff 变更（仅做参考）
            echo "### 📂 本次变更统计"
            echo "| 类型 | 数量 |"
            echo "|------|:----:|"
            echo "| 新增 | ${DIFF_ADDED} |"
            echo "| 修改 | ${DIFF_MODIFIED} |"
            echo "| 重命名 | ${DIFF_RENAMED} |"
            echo "| 删除 | ${DIFF_DELETED} |"
            echo ""

            # 4. 最终判定
            echo "### 最终判定"
            if [ "$IS_ERROR" = true ]; then
              echo "❌ **构建失败**"
              if [ "$PROTECTED_ERROR" = true ]; then
                echo "- 受保护文件（LICENSE/NOTICE）缺失"
              fi
              if [ "$FULLSCAN_ERROR" = true ]; then
                echo "- 有 ${FULLSCAN_COUNT} 个源文件缺少版权头"
                echo ""
                echo "📝 正确的版权头格式："
                echo '```'
                echo "/**"
                echo " * @license"
                echo " * Copyright 2026 Jyf0214"
                echo " * SPDX-License-Identifier: Apache-2.0"
                echo " */"
                echo '```'
                echo ""
                echo "原有文件请保留原版权，不要删除或修改 Google LLC / Qwen Team 声明"
              fi
            else
              echo "✅ **全部通过** — 全量扫描 ${{ steps.fullscan.outputs.total }} 个文件，版权头均完整"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "is_error=$IS_ERROR" >> "$GITHUB_OUTPUT"

      # ── Step 5: 阻断 ────────────────────────────────────────────
      - name: Fail on errors
        if: steps.summary.outputs.is_error == 'true'
        run: |
          echo "❌ 版权检查未通过！"
          echo ""
          echo "阻断原因（全量扫描，不受 diff 范围限制）："
          echo "  (1) LICENSE 或 NOTICE 文件缺失"
          echo "  (2) 任意源文件缺少 Copyright 声明或 SPDX-License-Identifier"
          exit 1
