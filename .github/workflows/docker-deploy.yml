name: Docker — Build & Deploy

on:
  push:
    branches:
      - docker
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── 构建验证 ──────────────────────────────────────────────
  build-verify:
    name: Build Verify
    runs-on: ubuntu-latest
    if: github.repository == 'Jyf0214/AutocodeLLM'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - name: Build project
        run: npm run build

      - name: Bundle
        run: npm run bundle

  # ── 同步到 Hugging Face ──────────────────────────────────
  sync-to-hf:
    name: Sync to Hugging Face
    runs-on: ubuntu-latest
    needs: build-verify
    if: >
      always() &&
      needs.build-verify.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.repository == 'Jyf0214/AutocodeLLM'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Sync to Hugging Face
        env:
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE }}
        run: bash scripts/sync-to-hf.sh

  # ── 构建基础镜像 (Dockerfile.base) ────────────────────────
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    needs: [build-verify, sync-to-hf]
    if: >
      always() &&
      needs.sync-to-hf.result == 'success' &&
      needs.build-verify.result == 'success' &&
      github.repository == 'Jyf0214/AutocodeLLM'
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.lowercase.outputs.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.IMAGE_NAME }}:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ── 构建 latest 镜像 ──────────────────────────────────────
  build-latest:
    name: Build Latest Image
    runs-on: ubuntu-latest
    needs: [build-verify, sync-to-hf, build-base]
    if: >
      always() &&
      needs.sync-to-hf.result == 'success' &&
      needs.build-verify.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      github.repository == 'Jyf0214/AutocodeLLM'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push latest image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CLI_VERSION_ARG=${{ github.sha }}
            BUILDKIT_INLINE_CACHE=1
